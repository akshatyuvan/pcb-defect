# PCB QC line, local. Days 6-8 grow this file; Day 6 stands up Kafka + the API.
#
# Memory budget against Docker Desktop's 4.11GB (8GB machine):
#   kafka  ~1.0GB   (JVM heap pinned at 512m; the rest is JVM overhead + page cache)
#   api    ~250MB   (measured on Day 5: 227MiB RSS. Originally budgeted 1GB, but
#                    pinning the CPU-only torch wheel index removed ~2.5GB of
#                    unusable CUDA libraries, so the real footprint is far below
#                    the estimate. mem_limit set to 512m, still 2x headroom.)
#   free   ~2.8GB   headroom for Day 7-8's three consumers at ~150MB each
# Consumers hold NO model - locked decision 10. That is what makes this fit.

services:
  kafka:
    # Official Apache image, multi-arch (linux/arm64 native on Apple Silicon).
    # KRaft: broker + controller in ONE process. Zookeeper was deprecated in
    # Kafka 3.5 and removed in 4.0; it would also cost a second JVM we cannot
    # afford here.
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    ports:
      # 29092 is the HOST-facing listener. The producer runs on the Mac in the
      # `pcb` conda env, not in a container, so it needs an advertised address
      # that resolves from the host. Containers use kafka:9092 instead.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Fixed cluster id so the KRaft metadata log survives `docker compose down`
      # and comes back consistent with the named volume.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single broker -> every replication factor must be 1, or internal topic
      # creation hangs forever waiting for replicas that will never exist.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # Zero rebalance delay: on Day 8 you will start and stop consumers
      # repeatedly to measure 1-vs-3 scaling. The 3s default just wastes time.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created explicitly by scripts/create_topics.sh. Auto-create
      # would silently give a typo'd topic name 1 partition and no error, which
      # is a genuinely miserable bug to find at 2am.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 512m heap. Kafka's default is 1GB, which alone is a quarter of the
      # Docker allocation. 512m is plenty for one broker and 4 small topics.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1200m
    healthcheck:
      # Each check spawns a JVM inside the container (~200MB transient), so a
      # 30s interval rather than the usual 10s. start_period covers KRaft format
      # + first boot on a cold volume.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      start_period: 45s
      retries: 5

  api:
    build: .
    image: pcb-api:0.5
    container_name: pcb-api
    ports:
      - "8000:8000"
    environment:
      PCB_MODEL_DIR: /app/artifacts/serving
      PCB_DEVICE: cpu
      PCB_TORCH_THREADS: "2"
    # 512m, not 1g: Day 5 measured 227MiB actual. Keeping the limit at 2x the
    # measured footprint catches a genuine leak while leaving ~800MB more for
    # Day 8's consumers than the original budget assumed.
    mem_limit: 512m
    restart: unless-stopped

volumes:
  kafka-data: